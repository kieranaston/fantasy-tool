[project]
name = "fantasy-tool"
version = "0.1.0"
description = "Fantasy football stats pipeline and static reference site"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nflreadpy>=0.1.5",
    "httpx>=0.27",
    "rapidfuzz>=3.0",
    "google-genai>=1.0",
    "polars>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
