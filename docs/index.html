<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Player News</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/site.css?v=47" />
    <script>
      setTimeout(function () {
        document.body.classList.remove("is-page-loading");
      }, 2500);
    </script>
  </head>
  <body class="is-page-loading">
    <nav class="site-nav" aria-label="Primary">
      <a href="index.html" class="is-active" aria-current="page">News</a>
      <a href="tables/adp.html">ADP</a>
      <a href="tables/draft.html">Draft</a>
    </nav>
    <main class="site-main">
      <div class="container">
        <div class="page-head">
          <p class="meta" data-injuries="summary">Loading…</p>
          <div class="news-search-row">
            <label for="news-player-search" class="visually-hidden">Search</label>
            <input
              id="news-player-search"
              type="search"
              spellcheck="false"
              autocomplete="off"
              placeholder="search"
            />
          </div>
        </div>
        <div id="injuries-container" class="injuries-list"></div>
      </div>
    </main>

    <script type="module">
      import { mountInjuriesPage } from "./js/injuries.js?v=21";
      mountInjuriesPage().catch(function (err) {
        document.body.classList.remove("is-page-loading");
        var el = document.getElementById("injuries-container");
        if (el) el.innerHTML = '<div class="error">' + (err && err.message ? err.message : String(err)) + "</div>";
      });
    </script>
  </body>
</html>
