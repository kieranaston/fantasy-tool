<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Trade Recommender</title>
    <link rel="stylesheet" href="../css/site.css?v=97" />
  </head>
  <body>
    <nav class="site-nav" aria-label="Primary">
      <a href="../index.html" class="site-brand">FFB Reference</a>
      <div class="site-nav-links">
        <a href="def.html">DEF</a>
        <a href="kickers.html">Kickers</a>
        <a href="qb.html">QBs</a>
        <a href="rb.html">RBs</a>
        <a href="wr.html">WRs</a>
        <a href="te.html">TEs</a>
        <a href="adp.html">ADP</a>
        <a href="draft.html">Draft</a>
        <a href="trade.html" class="is-active" aria-current="page">Trade</a>
      </div>
    </nav>
    <main class="site-main">
      <div class="container">
        <div class="draft-top">
          <div class="draft-setup">
            <div class="draft-setup-fields">
              <div class="draft-connect-row">
                <label for="trade-league-input">League</label>
                <input
                  id="trade-league-input"
                  type="text"
                  spellcheck="false"
                  autocomplete="off"
                  placeholder="Sleeper league link or ID"
                />
              </div>
              <div class="draft-connect-row draft-connect-row--seat">
                <label for="trade-team">Team</label>
                <select id="trade-team" disabled></select>
              </div>
            </div>
            <div class="draft-actions">
              <button type="button" id="trade-connect" class="draft-btn draft-btn--primary">Connect</button>
            </div>
          </div>
          <div class="draft-status">
            <p class="meta" id="trade-league-summary" hidden></p>
            <p class="meta" id="trade-status"></p>
          </div>
        </div>

        <section class="draft-panel">
          <h2 class="draft-section-title">Recommended trades</h2>
          <div id="trade-results" class="table-wrap draft-panel-body"></div>
        </section>
      </div>
    </main>

    <script type="module" src="../js/site-boot.js?v=15"></script>
    <script type="module">
      import { mountPage } from "../js/config.js?v=16";
      import { mountTradePage } from "../js/trade-companion.js?v=3";
      mountPage(mountTradePage, "trade-results");
    </script>
  </body>
</html>
