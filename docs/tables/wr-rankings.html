<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WR Rankings — Fantasy Reference</title>
    <link rel="stylesheet" href="../css/site.css?v=6" />
  </head>
  <body>
    <div class="site-layout">
      <aside class="site-nav" aria-label="Site">
        <a class="site-nav-brand" href="../index.html">Fantasy Reference</a>
        <nav class="site-nav-links">
          <a href="../index.html">Player News</a>
          <a href="overall-rankings.html">Overall</a>
          <a href="qb-rankings.html">QB</a>
          <a href="rb-rankings.html">RB</a>
          <a href="wr-rankings.html" class="is-active" aria-current="page">WR</a>
          <a href="te-rankings.html">TE</a>
        </nav>
      </aside>
      <main class="site-main">
        <div class="container">
          <h1 class="page-title">WR Rankings</h1>
      <p class="meta" data-draft="summary">Loading…</p>

      <div class="controls draft-controls">
        <div>
          <label id="format-label">Format</label>
          <div id="format-toggle" class="format-toggle" role="group" aria-label="Scoring format"></div>
        </div>
        <div class="draft-actions">
          <button type="button" id="draft-reset" class="draft-btn" title="Restore Sleeper ADP order">Reset to ADP</button>
          <button type="button" id="draft-download-csv" class="draft-btn">Download spreadsheet</button>
        </div>
      </div>

      <div id="table-container" class="table-wrap">
        <table id="wr-rankings-table" class="cell-border draft-table">
          <thead>
            <tr>
              <th>
                <span class="th-inner">
                  <span class="th-label">My Rank</span>
                  <span class="col-info" tabindex="0" data-tooltip="Your WR rank — drag rows to reorder">i</span>
                </span>
              </th>
              <th>
                <span class="th-inner">
                  <span class="th-label">Player</span>
                  <span class="col-info" tabindex="0" data-tooltip="Player name, team, and player-news status">i</span>
                </span>
              </th>
              <th>
                <span class="th-inner">
                  <span class="th-label">ADP</span>
                  <span class="col-info" tabindex="0" data-tooltip="Sleeper average draft position for this format">i</span>
                </span>
              </th>
              <th>
                <span class="th-inner">
                  <span class="th-label">ADP Rank</span>
                  <span class="col-info" tabindex="0" data-tooltip="Positional rank by Sleeper ADP (RB1, RB2, …)">i</span>
                </span>
              </th>
              <th>
                <span class="th-inner">
                  <span class="th-label">Value</span>
                  <span class="col-info" tabindex="0" data-tooltip="Positional ADP rank minus my rank. Positive means the market ranks them lower than you (value)">i</span>
                </span>
              </th>
              <th>
                <span class="th-inner">
                  <span class="th-label"></span>
                </span>
              </th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
        </div>
      </main>
    </div>

    <script type="module">
      import { mountAdpRankingsPage } from "../js/adp-rankings.js?v=11";
      mountAdpRankingsPage({ position: "wr", tableId: "wr-rankings-table" });
    </script>
  </body>
</html>
