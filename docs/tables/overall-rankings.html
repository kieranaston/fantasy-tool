<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overall Rankings</title>
    <link rel="stylesheet" href="../css/site.css?v=9" />
  </head>
  <body>
    <nav class="site-nav" aria-label="Primary">
      <a href="../index.html">Player News</a>
      <a href="overall-rankings.html" class="is-active" aria-current="page">Overall</a>
      <a href="qb-rankings.html">QB</a>
      <a href="rb-rankings.html">RB</a>
      <a href="wr-rankings.html">WR</a>
      <a href="te-rankings.html">TE</a>
    </nav>
    <main class="site-main">
      <div class="container">
        <h1 class="page-title">Overall Rankings</h1>
      <p class="meta" data-draft="summary">Loading…</p>

      <div class="controls draft-controls">
        <div>
          <label id="format-label">Format</label>
          <div id="format-toggle" class="format-toggle" role="group" aria-label="Scoring format"></div>
        </div>
        <div class="draft-actions">
          <button type="button" id="draft-reset" class="draft-btn" title="Restore Sleeper ADP order">Reset to ADP</button>
          <button type="button" id="draft-download-csv" class="draft-btn">Download spreadsheet</button>
        </div>
      </div>

      <div id="table-container" class="table-wrap">
        <table id="overall-rankings-table" class="cell-border draft-table">
          <thead>
            <tr>
              <th>
                <span class="th-inner">
                  <span class="th-label">My Rank</span>
                  <span class="col-info" tabindex="0" data-tooltip="Your overall draft order — drag rows to reorder">i</span>
                </span>
              </th>
              <th>
                <span class="th-inner">
                  <span class="th-label">Player</span>
                  <span class="col-info" tabindex="0" data-tooltip="Player name, team, and player-news status">i</span>
                </span>
              </th>
              <th>
                <span class="th-inner">
                  <span class="th-label">Pos</span>
                  <span class="col-info" tabindex="0" data-tooltip="Position">i</span>
                </span>
              </th>
              <th>
                <span class="th-inner">
                  <span class="th-label">ADP</span>
                  <span class="col-info" tabindex="0" data-tooltip="Sleeper average draft position for this format">i</span>
                </span>
              </th>
              <th>
                <span class="th-inner">
                  <span class="th-label">Value</span>
                  <span class="col-info" tabindex="0" data-tooltip="ADP minus my rank. Positive means the market takes them later than you would (value)">i</span>
                </span>
              </th>
              <th>
                <span class="th-inner">
                  <span class="th-label"></span>
                </span>
              </th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      </div>
    </main>

    <script type="module">
      import { mountAdpRankingsPage } from "../js/adp-rankings.js?v=18";
      mountAdpRankingsPage({ position: "overall", tableId: "overall-rankings-table" });
    </script>
  </body>
</html>
