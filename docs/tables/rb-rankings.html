<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RB Rankings — Fantasy Reference</title>
    <link rel="stylesheet" href="../css/site.css" />
  </head>
  <body>
    <div class="site-layout">
      <aside id="site-nav" class="site-nav" aria-label="Site"></aside>
      <main class="site-main">
        <div class="container">
          <h1 class="page-title">RB Rankings</h1>
      <p class="meta" data-draft="summary">Loading…</p>

      <div class="controls draft-controls">
        <div>
          <label id="format-label">Format</label>
          <div id="format-toggle" class="format-toggle" role="group" aria-label="Scoring format"></div>
        </div>
        <div class="draft-actions">
          <button type="button" id="draft-reset" class="draft-btn" title="Restore Sleeper ADP order">Reset to ADP</button>
          <button type="button" id="draft-download-csv" class="draft-btn">Download spreadsheet</button>
        </div>
      </div>

      <div id="table-container" class="table-wrap">
        <table id="rb-rankings-table" class="cell-border draft-table">
          <thead>
            <tr>
              <th>
                <span class="th-inner">
                  <span class="th-label">My Rank</span>
                  <span class="col-info" tabindex="0" data-tooltip="Your RB rank — drag rows to reorder">i</span>
                </span>
              </th>
              <th>
                <span class="th-inner">
                  <span class="th-label">Tier</span>
                  <span class="col-info" tabindex="0" data-tooltip="Your tier grouping. Use + on a row to add a break below">i</span>
                </span>
              </th>
              <th>
                <span class="th-inner">
                  <span class="th-label">Player</span>
                  <span class="col-info" tabindex="0" data-tooltip="Player name, team, and player-news status">i</span>
                </span>
              </th>
              <th>
                <span class="th-inner">
                  <span class="th-label">ADP</span>
                  <span class="col-info" tabindex="0" data-tooltip="Sleeper average draft position for this format">i</span>
                </span>
              </th>
              <th>
                <span class="th-inner">
                  <span class="th-label">ADP Rank</span>
                  <span class="col-info" tabindex="0" data-tooltip="Positional rank by Sleeper ADP (RB1, RB2, …)">i</span>
                </span>
              </th>
              <th>
                <span class="th-inner">
                  <span class="th-label">Value</span>
                  <span class="col-info" tabindex="0" data-tooltip="Positional ADP rank minus my rank. Positive means you're higher than ADP (a reach); negative means you're lower">i</span>
                </span>
              </th>
              <th>
                <span class="th-inner">
                  <span class="th-label"></span>
                </span>
              </th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
        </div>
      </main>
    </div>

    <script type="module">
      import { mountSiteNav } from "../js/site-nav.js";
      import { mountAdpRankingsPage } from "../js/adp-rankings.js?v=5";
      mountSiteNav({ current: "rb" });
      mountAdpRankingsPage({ position: "rb", tableId: "rb-rankings-table" });
    </script>
  </body>
</html>
