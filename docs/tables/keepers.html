<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Keeper Value</title>
    <link rel="stylesheet" href="../css/site.css?v=97" />
  </head>
  <body>
    <nav class="site-nav" aria-label="Primary">
      <a href="../index.html" class="site-brand">FFB Reference</a>
      <div class="site-nav-links">
        <a href="def.html">DEF</a>
        <a href="kickers.html">Kickers</a>
        <a href="qb.html">QBs</a>
        <a href="rb.html">RBs</a>
        <a href="wr.html">WRs</a>
        <a href="te.html">TEs</a>
        <a href="adp.html">ADP</a>
        <a href="draft.html">Draft</a>
        <a href="keepers.html" class="is-active" aria-current="page">Keepers</a>
      </div>
    </nav>
    <main class="site-main">
      <div class="container">
        <div class="draft-top">
          <div class="draft-setup">
            <div class="draft-setup-fields">
              <div class="draft-connect-row">
                <label for="keepers-league-input">League</label>
                <input
                  id="keepers-league-input"
                  type="text"
                  spellcheck="false"
                  autocomplete="off"
                  placeholder="Sleeper league link or ID"
                />
              </div>
              <div class="draft-connect-row draft-connect-row--seat">
                <label for="keepers-team">Team</label>
                <select id="keepers-team" disabled></select>
              </div>
            </div>
            <div class="draft-actions">
              <button type="button" id="keepers-connect" class="draft-btn draft-btn--primary">Connect</button>
            </div>
          </div>
          <div class="draft-status">
            <p class="meta" id="keepers-league-summary" hidden></p>
            <p class="meta" id="keepers-status"></p>
          </div>
        </div>

        <p class="meta">
          Cost is the round the player was most recently drafted in (waivers
          cost round 10). Surplus = FantasyCalc value − pick value at the cost
          round. Players kept two seasons in a row must return to the draft
          pool.
        </p>

        <div id="keepers-results"></div>
      </div>
    </main>

    <script type="module" src="../js/site-boot.js?v=15"></script>
    <script type="module">
      import { mountPage } from "../js/config.js?v=16";
      import { mountKeepersPage } from "../js/keeper-companion.js?v=1";
      mountPage(mountKeepersPage, "keepers-results");
    </script>
  </body>
</html>
