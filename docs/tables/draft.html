<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draft Companion</title>
    <link rel="stylesheet" href="../css/site.css?v=24" />
  </head>
  <body class="is-page-loading">
    <nav class="site-nav" aria-label="Primary">
      <a href="../index.html">Player News</a>
      <a href="adp.html">ADP</a>
      <a href="draft.html" class="is-active" aria-current="page">Draft</a>
    </nav>
    <main class="site-main">
      <div class="container">
        <div class="controls draft-controls">
          <div class="draft-connect-row">
            <label for="draft-league-input">Sleeper league ID</label>
            <input
              id="draft-league-input"
              type="text"
              spellcheck="false"
              placeholder="League id or sleeper.com/leagues/… URL"
            />
          </div>
          <div class="draft-connect-row">
            <label for="draft-id-input">Draft ID / URL</label>
            <input
              id="draft-id-input"
              type="text"
              spellcheck="false"
              placeholder="Draft id or sleeper.com/draft/… URL"
            />
          </div>
          <div class="draft-connect-row draft-connect-row--seat">
            <label for="draft-seat">Your slot</label>
            <select id="draft-seat"></select>
          </div>
          <div class="draft-actions">
            <button type="button" id="draft-connect" class="draft-btn">Connect live</button>
            <button type="button" id="draft-pause" class="draft-btn">Pause</button>
          </div>
        </div>

        <section class="draft-panel">
          <h2 class="draft-section-title">Your roster</h2>
          <div id="draft-needs"></div>
        </section>

        <section class="draft-panel">
          <h2 class="draft-section-title">Player search</h2>
          <div class="draft-search-row">
            <label for="draft-player-search" class="visually-hidden">Search players</label>
            <input
              id="draft-player-search"
              type="search"
              spellcheck="false"
              autocomplete="off"
              placeholder="Search by name, team, or position"
            />
          </div>
          <div id="draft-search-results" class="table-wrap">
            <p class="meta">Type to search players and see live scores.</p>
          </div>
        </section>

        <div class="draft-columns">
          <section class="draft-panel">
            <h2 class="draft-section-title">Recommended pick</h2>
            <div id="draft-recommendations" class="table-wrap"></div>
          </section>

          <section class="draft-panel">
            <h2 class="draft-section-title">Recent picks</h2>
            <div id="draft-board" class="table-wrap"></div>
          </section>
        </div>

      </div>
    </main>

    <script type="module">
      import { mountDraftCompanionPage } from "../js/draft-companion.js?v=61";
      mountDraftCompanionPage();
    </script>
  </body>
</html>
