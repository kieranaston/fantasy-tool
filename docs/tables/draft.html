<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Draft Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/site.css?v=41" />
    <script>
      setTimeout(function () {
        document.body.classList.remove("is-page-loading");
      }, 2500);
    </script>
  </head>
  <body class="is-page-loading">
    <nav class="site-nav" aria-label="Primary">
      <a href="../index.html">News</a>
      <a href="adp.html">ADP</a>
      <a href="draft.html" class="is-active" aria-current="page">Draft</a>
    </nav>
    <main class="site-main">
      <div class="container">
        <div class="page-head">
          <div class="page-head-meta">
            <p class="meta" id="draft-league-summary" hidden></p>
            <p class="meta" data-draft-live="status">Loading…</p>
          </div>
          <div id="sync-bar" class="sync-bar" hidden></div>
        </div>

        <div class="draft-setup">
          <div class="draft-setup-fields">
            <div class="draft-connect-row">
              <label for="draft-league-input">League</label>
              <input
                id="draft-league-input"
                type="text"
                spellcheck="false"
                autocomplete="off"
              />
            </div>
            <div class="draft-connect-row">
              <label for="draft-id-input">Draft</label>
              <input
                id="draft-id-input"
                type="text"
                spellcheck="false"
                autocomplete="off"
              />
            </div>
            <div class="draft-connect-row draft-connect-row--seat">
              <label for="draft-seat">Slot</label>
              <select id="draft-seat"></select>
            </div>
          </div>
          <div class="draft-actions">
            <button type="button" id="draft-connect" class="draft-btn draft-btn--primary">Connect</button>
            <button type="button" id="draft-pause" class="draft-btn">Pause</button>
          </div>
        </div>

        <section class="draft-panel">
          <h2 class="draft-section-title">Roster</h2>
          <div id="draft-needs"></div>
        </section>

        <div class="draft-columns">
          <section class="draft-panel">
            <div class="panel-head">
              <h2 class="draft-section-title">Players</h2>
              <div class="draft-search-row">
                <label for="draft-player-search" class="visually-hidden">Search players</label>
                <input
                  id="draft-player-search"
                  type="search"
                  spellcheck="false"
                  autocomplete="off"
                  placeholder="search"
                />
              </div>
            </div>
            <div class="draft-board-stack">
              <div id="draft-search-results" class="table-wrap"></div>
              <div id="draft-recommendations" class="table-wrap"></div>
            </div>
          </section>

          <section class="draft-panel">
            <div class="panel-head">
              <h2 class="draft-section-title">Recent picks</h2>
            </div>
            <div id="draft-board" class="table-wrap"></div>
          </section>
        </div>

      </div>
    </main>

    <script type="module">
      import { mountDraftCompanionPage } from "../js/draft-companion.js?v=119";
      mountDraftCompanionPage();
    </script>
  </body>
</html>
