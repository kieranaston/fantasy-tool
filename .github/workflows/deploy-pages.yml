name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  # The refresh jobs commit with [skip ci], which suppresses the push trigger
  # above, so publish off their completion instead.
  workflow_run:
    workflows: ["Refresh ADP", "Refresh streamers", "Refresh player values"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; cancel an older queued/in-flight deploy when a
# newer one starts so a wedged Pages lock cannot block the queue forever.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      # Retried because deploy-pages intermittently fails while fetching its
      # OIDC ID token ("Request timeout: /37//idtoken/..."), which is a
      # transient GitHub-side flake rather than a workflow problem.
      - id: deploy
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: actions/deploy-pages@v5
          with: |
            # The action defaults to giving up after 10 minutes. Pages
            # deployment lag can exceed that, which aborts a deploy that
            # would have landed.
            timeout: 1800000
          attempt_limit: 3
          attempt_delay: 15000
