name: Refresh streamers

on:
  schedule:
    # Daily ~05:23 ET (09:23 UTC). Off the hour to avoid GitHub cron delays;
    # runs after the Monday night game's final score lands in nflverse.
    - cron: "23 9 * * *"
    # Backup run ~09:23 ET (13:23 UTC) in case nflverse hadn't posted yet.
    - cron: "23 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install .

      - name: Build streamer boards (DEF, K, QB, RB, WR)
        run: python -m src.run_streamers

      - name: Commit updated streamer data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/streamers/
          if git diff --staged --quiet; then
            echo "No streamer changes to commit."
          else
            git commit -m "chore: refresh streamer boards [skip ci]"
            git push
          fi
