name: Refresh streamers

on:
  schedule:
    # Tuesdays 15:00 UTC — lines usually settled after MNF
    - cron: "0 15 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install .

      - name: Build streamer boards (DEF, K, QB, RB, WR)
        run: python -m src.run_streamers

      - name: Commit updated streamer data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/streamers/
          if git diff --staged --quiet; then
            echo "No streamer changes to commit."
          else
            git commit -m "chore: refresh streamer boards [skip ci]"
            git push
          fi
